{% extends "base.html" %}
{% block title %}Create workflow - n8nManager{% endblock %}
{% block content %}
<div class="creator">
    <div class="creator-header">
        <h1>Create a new workflow</h1>
        <div>
            <input type="text" id="workflow-name" placeholder="Workflow name" class="input-lg" value="New workflow">
            <button onclick="saveNewWorkflow()" class="btn btn-primary">Save</button>
        </div>
    </div>
    <div class="editor-layout">
        <div class="editor-sidebar">
            <h3>Node catalog</h3>
            <div id="node-catalog-list"></div>
        </div>
        <div id="creator-graph" class="graph-container"></div>
        <div class="editor-properties">
            <h3>Properties</h3>
            <div id="property-panel">
                <p class="empty-state">Add nodes from the catalog</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/graph_renderer.js"></script>
<script src="/static/js/workflow_editor.js"></script>
<script>
    const nodeCatalog = {{ node_catalog | tojson }};
    initCreator('creator-graph', nodeCatalog);
</script>
{% endblock %}
