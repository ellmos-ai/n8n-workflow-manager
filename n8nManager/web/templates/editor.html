{% extends "base.html" %}
{% block title %}{{ workflow.name }} - Editor{% endblock %}
{% block content %}
<div class="editor">
    <div class="editor-header">
        <h1>Editor: {{ workflow.name }}</h1>
        <div class="editor-actions">
            <button onclick="saveWorkflow()" class="btn btn-primary">Save</button>
            <a href="/viewer/{{ workflow.id }}" class="btn">Back to viewer</a>
        </div>
    </div>
    <div class="editor-layout">
        <div class="editor-sidebar">
            <h3>Node catalog</h3>
            <div id="node-catalog-list"></div>
        </div>
        <div id="editor-graph" class="graph-container"></div>
        <div class="editor-properties">
            <h3>Properties</h3>
            <div id="property-panel">
                <p class="empty-state">Click a node to edit it</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/graph_renderer.js"></script>
<script src="/static/js/workflow_editor.js"></script>
<script>
    const graphData = {{ graph_data | tojson }};
    const nodeCatalog = {{ node_catalog | tojson }};
    const workflowData = {{ workflow_data | tojson }};
    const workflowId = {{ workflow.id }};
    initEditor('editor-graph', graphData, nodeCatalog, workflowId, workflowData);
</script>
{% endblock %}
