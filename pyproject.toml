[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "n8n-workflow-manager"
version = "0.2.0"
description = "Local-first n8n workflow manager with visual graph viewer, REST API, CLI, and multi-server sync"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Lukas Geiger", email = "lukisch@users.noreply.github.com"}
]
keywords = ["n8n", "n8n-workflows", "workflow", "workflow-manager", "workflow-sync", "automation", "workflow-automation", "manager", "visualization", "vis.js", "fastapi", "local-first", "ai-agents", "python-cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "jinja2>=3.1,<4",
    "pydantic>=2.8,<3",
    "python-multipart>=0.0.18,<1",
]

[project.optional-dependencies]
ssh = ["paramiko>=3,<5"]
dev = [
    "bandit>=1.8,<2",
    "build>=1.2,<2",
    "httpx2>=2.7,<3",
    "pip-audit>=2.8,<3",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.9,<1",
]

[project.scripts]
n8n-manager = "n8nManager.n8n_manager:main"

[project.urls]
Homepage = "https://github.com/ellmos-ai/n8n-workflow-manager"
Documentation = "https://github.com/ellmos-ai/n8n-workflow-manager#readme"
Repository = "https://github.com/ellmos-ai/n8n-workflow-manager"
Issues = "https://github.com/ellmos-ai/n8n-workflow-manager/issues"

[tool.setuptools.packages.find]
include = ["n8nManager*"]

[tool.setuptools.package-data]
n8nManager = [
    "*.ico",
    "web/static/*",
    "web/static/css/*",
    "web/static/js/*",
    "web/templates/*",
    "templates/*.json",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Pin the rule set explicitly. Without this, `ruff check` follows whatever the
# installed ruff considers its default, so a new ruff release can turn a green
# CI red without a single line of code changing -- which is exactly what happened
# on 2026-07-24 (ruff 0.15 added UP045, N999, RUF0xx and others to the defaults).
# Widening this list is a deliberate decision, not a side effect of an upgrade.
select = ["E4", "E7", "E9", "F"]
